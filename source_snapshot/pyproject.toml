[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-st"
version = "1.3.8"
description = "STIA: multi-axis performance and robustness auditing for spatial transcriptomics integration"
readme = "README_SUBMISSION.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "invest-st contributors" }]
keywords = ["spatial transcriptomics", "integration", "batch correction", "audit", "order invariance"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "anndata>=0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
invest = "invest_st.cli:main"
stia = "stia.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["invest_st", "invest_st.*", "stia"]
exclude = ["stia.crossmethod", "stia.crossmethod.*"]

